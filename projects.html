          <h3>Desk Organizer</h3>
          <p>Aside from my shoes clustered together, my floor is always pretty clean. But my desk? An abosolute nightmare. The thing is, in a college dorm room, there's not much space.</p>
          <p>Naturally, the first place I turned to was the Internet. Desk organizers are everywhere. TikTok is full of videos of dreamy dorm rooms where everything is neatly organized. My issue? <p>
          <p>I couldn't find organizers that worked for my high-frequency use items. I bought a pan to cook with for the summer and two spatulas that were taking up so much space on my desk. I had the bad habit of putting my hairbrush on my desk because I was too lazy to pull out the drawer and put it back in the appropriate bin. My plastic utensils were sitting in a mug that I'd have to take out every time I wanted to microwave food. My sunscreen was shoved into a drawer, causing me to forget to put it on some mornings. <p>
          <p>You likely get the point. Most organizers are made for makeup or pencils or kitchenware, but the reality is, the dorm room just doesn't have that much space. I wanted varying sizes, and to not perpetuate my own bad habits, I wanted everything in the organizer to be visible. To conserve space, I also wanted multiple levels to be able to store my pan. <p>
